# Os mesmos portoes que a regra de trabalho exige na maquina, rodando sozinhos:
# `tsc`, os scripts de scripts/checks/ e o build. O quarto portao (abrir o
# navegador) nao cabe aqui — continua sendo manual.
name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  portoes:
    runs-on: ubuntu-latest
    env:
      # `prisma generate` (dentro de `npm run build`) exige a variavel PRESENTE,
      # mas NAO conecta: nenhum passo aqui toca banco. Valor ficticio de proposito
      # — um DATABASE_URL real em CI seria credencial de producao num log publico.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: tsc --noEmit
        run: npx tsc --noEmit

      # A linha que o laco de bash prometia. Mesmo comportamento (aborta na
      # primeira falha); a diferenca e que agora roda igual na maquina do dev,
      # inclusive no Windows, onde o laco de bash nunca rodou.
      - name: scripts/checks
        run: npm run check

      - name: build
        run: npm run build
